# Krok 2 wersji MC (#30): kryteria obowiązkowe i dodatkowe, dobór wskaźników do zadań z OSP.
# Treść merytoryczna z cytatami; kod (kompas_mc/krok2.py) łączy ją z modelem kompetencji i OSP.
# Kompetencje i wskaźniki wskazujemy przez `id` z /api/model-kompetencji (slug nazwy z modelu).

wersja: krok2-mc-1

obowiazkowe:
  PIERWSZA:
    kompetencje:
      - rzetelnosc
      - wykorzystywanie-wiedzy-i-doskonalenie-zawodowe
      - organizacja-pracy-i-orientacja-na-osiaganie-celow
      - komunikacja
      - wspolpraca
    adnotacje:
      - kategoria: PRZEPIS
        doc_id: rozp-2015-pierwsza
        lokalizator: § 2 pkt 1
        strona: 1
        cytat_dosłowny: >-
          oceniane za pomocą następujących elementów oceny: a) rzetelność, b) wykorzystywanie
          wiedzy i doskonalenie zawodowe, c) organizacja pracy i orientacja na osiąganie celów,
          d) komunikacja, e) współpraca;
  B:
    kompetencje:
      - zarzadzanie-ludzmi
      - podejmowanie-decyzji-i-odpowiedzialnosc
      - organizacja-pracy-i-orientacja-na-osiaganie-celow
      - wspolpraca
      - komunikacja
    adnotacje:
      - kategoria: PRZEPIS
        doc_id: rozp-2016-okresowe
        lokalizator: § 4 ust. 2
        strona: 2
        cytat_dosłowny: >-
          2. Ocenianego zatrudnionego na stanowisku, o którym mowa w § 3 ust. 3, ocenia się,
          stosując następujące kryteria obowiązkowe: 1) zarządzanie ludźmi; 2) podejmowanie decyzji
          i odpowiedzialność; 3) organizacja pracy i orientacja na osiąganie celów; 4) współpraca;
          5) komunikacja.
  C:
    kompetencje:
      - wykorzystywanie-wiedzy-i-doskonalenie-zawodowe
      - rzetelnosc
      - organizacja-pracy-i-orientacja-na-osiaganie-celow
      - wspolpraca
      - komunikacja
    adnotacje:
      - kategoria: PRZEPIS
        doc_id: rozp-2016-okresowe
        lokalizator: § 4 ust. 3
        strona: 2
        cytat_dosłowny: >-
          3. Ocenianego zatrudnionego na stanowisku, o którym mowa w § 3 ust. 4, ocenia się,
          stosując następujące kryteria obowiązkowe: 1) wykorzystywanie wiedzy i doskonalenie
          zawodowe; 2) rzetelność; 3) organizacja pracy i orientacja na osiąganie celów;
          4) współpraca; 5) komunikacja.

dodatkowe:
  okresowa:
    limit: 3
    adnotacje:
      - kategoria: PRZEPIS
        doc_id: rozp-2016-okresowe
        lokalizator: § 5 ust. 2
        strona: 2
        cytat_dosłowny: >-
          Oceniający może wybrać z wykazu kryteriów oceny nie więcej niż 3 kryteria dodatkowe,
          najistotniejsze ze względu na charakter obowiązków wynikających z opisu stanowiska pracy
          zajmowanego przez ocenianego.
  pierwsza:
    limit: 0
    adnotacje:
      - kategoria: PRZEPIS
        doc_id: rozp-2015-pierwsza
        lokalizator: § 2
        strona: 1
        cytat_dosłowny: >-
          Pierwszej oceny pracownika służby cywilnej, zwanego dalej „ocenianym”, dokonuje się,
          biorąc pod uwagę:
        uzasadnienie: >-
          § 2 rozp. 2015 wymienia zamkniętą listę pięciu elementów oceny; rozporządzenie nie
          przewiduje kryteriów dodatkowych.

# Gdzie szukać nazwy wskaźnika w przepisach (test zgodności i pole `podstawa` przy wskaźniku).
podstawa_wskaznikow:
  okresowa: rozp-2016-okresowe
  pierwsza: rozp-2015-pierwsza

metodyka:
  id: krok2-mc-1
  status: DECYZJA_PROJEKTOWA – wymaga zatwierdzenia
  opis: >-
    Zadanie z OSP uzasadnia wskaźnik, gdy zawiera któreś ze słów kluczowych wskaźnika (porównanie
    bez wielkości liter, fragment słowa). Wskaźnik z co najmniej jednym zadaniem jest proponowany.
    Kryterium dodatkowe dostaje 3 pkt, gdy jest kompetencją miękką z OSP, oraz 2 pkt za każde
    zadanie dominujące i 1 pkt za każde pozostałe zadanie pasujące do jego wskaźników. System
    proponuje najwyżej tyle kryteriów, ile wynosi limit, z punktami > 0. Decyzja należy do
    przełożonego.
  adnotacje:
    - kategoria: OBJAŚNIENIE_MATERIAŁU
      doc_id: model-kompetencji
      lokalizator: Model kompetencji!A4
      cytat_dosłowny: Dobierz wskaźniki do zadań i zakresu odpowiedzialności na stanowisku.
    - kategoria: DECYZJA_PROJEKTOWA
      uzasadnienie: >-
        Model kompetencji każe dobrać wskaźniki do zadań, ale nie podaje sposobu. Słowa kluczowe
        dobrała drużyna; są jawne i do zatwierdzenia przez mentora MC.
      zatwierdził: osoba E (ścieżka oceny MC) – do zatwierdzenia przez mentora MC

