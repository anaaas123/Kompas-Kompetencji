# Źródła MC dla terminów oceny okresowej.
wersja: mc-terminy-okresowe@1
# Korpus MC podaje regułę dla niedziel i świąt. Kalendarz świąt urzędu można uzupełnić tu.
# Dni ustawowo wolne od pracy 2025–2028 (ustawa o dniach wolnych od pracy, art. 1; Wigilia wolna od 2025 r.):
# święta stałe, Wielkanoc i Poniedziałek Wielkanocny, Zielone Świątki (+49 dni), Boże Ciało (+60 dni).
# Termin przypadający na niedzielę albo taki dzień przesuwa się na następny dzień roboczy.
