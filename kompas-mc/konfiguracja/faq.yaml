  - id: FAQ-M02
    sciezka: wspolne
    pytania:
      - na czym opierać ocenę kompetencji
      - jak dokumentować przykłady zachowań pracownika
    odpowiedz: Na konkretnych przykładach z ocenianego okresu – sytuacja, działanie, rezultat – z uwzględnieniem powtarzalności, złożoności i dostępnych uprawnień.
    adnotacje:
      - {kategoria: OBJAŚNIENIE_MATERIAŁU, doc_id: model-kompetencji, lokalizator: "Model kompetencji!A5",
