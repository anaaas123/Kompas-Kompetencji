[project]
name = "kompas-mc"
version = "0.1.0"
description = "Backend aplikacji Kompas Kompetencji."
requires-python = ">=3.11"
dependencies = [
    "kompas-core",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
]

[project.scripts]
kompas-mc = "kompas_mc.__main__:main"

[tool.uv.sources]
kompas-core = { path = "../../kompas-core", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kompas_mc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
